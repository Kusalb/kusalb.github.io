<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07111f">
  <title>Page not found — Kusal Bista</title>
  <link rel="icon" type="image/svg+xml" href="/icon-kb.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    const stored = localStorage.getItem("kb-theme");
    const preferred = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = stored || preferred;
  </script>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <span class="error-code">ERROR / 404</span>
      <h1>Signal lost.</h1>
      <p>The page you requested does not exist or has moved.</p>
      <a class="button button-primary" href="/">Return to the portfolio ↗</a>
    </section>
  </main>
</body>
</html>
